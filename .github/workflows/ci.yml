name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: medico-app/package-lock.json
      - name: Install
        working-directory: medico-app
        run: npm ci --legacy-peer-deps
      - name: Typecheck and build
        working-directory: medico-app
        run: npm run build

  data:
    name: Question data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate question banks
        run: python .github/scripts/check_data.py

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for junk, secrets, and conflict markers
        run: .github/scripts/check_hygiene.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: medico-app/package-lock.json
      - name: Install
        working-directory: medico-app
        run: npm ci --legacy-peer-deps
      # main carries 10 eslint errors. Blocking on a clean run would fail every
      # PR for faults it did not introduce; a permanently-red advisory job
      # would teach everyone to ignore red. This fails only when the count
      # rises above .github/lint-baseline.txt.
      - name: No new eslint errors
        run: .github/scripts/check_lint.sh
